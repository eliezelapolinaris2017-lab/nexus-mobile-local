name: Pruebas Nexus Mobile Local
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis y autonomía
        run: |
          node --check mobile.js
          node --check standalone-ui.js
          node --check local-db.js
          node --check sw.js
          node --check tests/browser.mjs
          ! grep -E 'firebaseConfig|www.gstatic.com/firebasejs|oasisservicepr.com|confirmafy.com' mobile.js index.html local-db.js standalone-ui.js
      - name: Instalar navegadores
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Pruebas de flujo local
        run: |
          python3 -m http.server 8080 > /tmp/nexus-local-server.log 2>&1 &
          node tests/browser.mjs
